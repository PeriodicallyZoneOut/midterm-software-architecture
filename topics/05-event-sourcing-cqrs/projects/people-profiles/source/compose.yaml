name: people-kurrent

x-app-env: &app-env
  READ_DB_HOST: read-db
  READ_DB_NAME: people_read
  READ_DB_USER: people_projector
  READ_DB_PASSWORD_FILE: /run/secrets/read_db_password
  MQ_HOST: rabbitmq
  MQ_USER: people_app
  MQ_PASSWORD_FILE: /run/secrets/mq_password
  MQ_EXCHANGE: people.events

services:
  rabbitmq:
    image: rabbitmq:4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    hostname: people-rabbitmq
    volumes:
      - mq_data:/var/lib/rabbitmq
      - ./.secrets/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  read-db:
    image: mariadb:11.8@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/read_db_root_password
      MARIADB_DATABASE: people_read
      MARIADB_USER: people_projector
      MARIADB_PASSWORD_FILE: /run/secrets/read_db_password
    secrets: [read_db_root_password, read_db_password]
    volumes: ['read_data:/var/lib/mysql']
    ports: ['127.0.0.1:${READ_DB_HOST_PORT:-3307}:3306']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  init-db:
    image: people-kurrent-app:local
    build: .
    command: ['node', 'init-db.js']
    environment: *app-env
    secrets: [read_db_password, mq_password]
    depends_on:
      read-db: { condition: service_healthy }
    restart: 'no'

  publisher:
    image: people-kurrent-app:local
    command: ['node', 'publisher.js']
    environment: *app-env
    secrets: [read_db_password, mq_password]
    depends_on:
      init-db: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3006').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

  read-consumer:
    image: people-kurrent-app:local
    command: ['node', 'read-consumer.js']
    environment: *app-env
    secrets: [read_db_password, mq_password]
    depends_on:
      init-db: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3004').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

  email-consumer:
    image: people-kurrent-app:local
    command: ['node', 'email-consumer.js']
    environment:
      <<: *app-env
      SMTP_CONFIG_FILE: /run/secrets/smtp_config
    secrets: [read_db_password, mq_password, smtp_config]
    depends_on:
      init-db: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3005').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

  app:
    image: people-kurrent-app:local
    build: .
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '3003'
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3003}
    secrets: [read_db_password, mq_password]
    ports: ['127.0.0.1:${APP_PORT:-3003}:3003']
    depends_on:
      init-db: { condition: service_completed_successfully }
      read-consumer: { condition: service_healthy }
      publisher: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

volumes:
  read_data:
  mq_data:
  # Existing event-store volumes are preserved as archives, not mounted.
  kurrent_data:
  kurrent_logs:

secrets:
  read_db_root_password:
    file: ./.secrets/read-db-root-password
  read_db_password:
    file: ./.secrets/read-db-password
  mq_password:
    file: ./.secrets/mq-password
  smtp_config:
    file: ./.env.smtp
