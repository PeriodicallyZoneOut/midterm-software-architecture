server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 valid=5s ipv6=off;
 location /api/ {
  set $gateway http://gateway:3000;
  proxy_pass $gateway;
  proxy_read_timeout 10s;
  proxy_intercept_errors on;
  error_page 502 504 =503 /upstream-unavailable;
 }
 location = /upstream-unavailable {
  internal;
  default_type application/json;
  return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Dịch vụ tạm thời không khả dụng."}}';
 }
 location / { try_files $uri $uri/ /index.html; }
}
